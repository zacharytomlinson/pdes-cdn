<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }} · {% block title %}{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <style>
        :root {
            --ink: #0f172a;
            --panel: #111827;
            --accent: #0ea5e9;
            --accent-strong: #06b6d4;
            --soft: #cbd5e1;
            --border: #1f2937;
            --warn: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(14,165,233,0.12), transparent 30%),
                        radial-gradient(circle at 80% 0%, rgba(6,182,212,0.12), transparent 25%),
                        #0b1222;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 32px 20px 64px;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-strong); }
        .page {
            max-width: 1080px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-size: 20px;
        }
        .brand svg { height: 38px; width: auto; display: block; overflow: visible; }
        .profile-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(14,165,233,0.12);
            border: 1px solid rgba(14,165,233,0.35);
            border-radius: 12px;
            color: #e2e8f0;
            cursor: pointer;
        }
        .profile-chip svg { width: 22px; height: 22px; display: block; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(14,165,233,0.15);
            border: 1px solid rgba(14,165,233,0.3);
            border-radius: 12px;
            color: #e2e8f0;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 60px rgba(0,0,0,0.35);
        }
        .card h1, .card h2 { margin-top: 0; }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        label { font-size: 14px; color: var(--soft); }
        input, button, select {
            font-family: inherit;
            font-size: 16px;
        }
        input {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1425;
            color: #e2e8f0;
        }
        select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1425;
            color: #e2e8f0;
        }
        details summary {
            cursor: pointer;
            font-weight: 600;
            padding: 6px 0;
        }
        details {
            border-left: 2px solid var(--border);
            padding-left: 10px;
            margin-bottom: 6px;
        }
        input:focus {
            outline: 2px solid rgba(14,165,233,0.45);
            border-color: rgba(14,165,233,0.65);
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            color: #0b1222;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(6,182,212,0.3); }
        button.secondary {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .icon-btn, .icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .icon-btn svg, .icon-link svg { width: 16px; height: 16px; display: block; }
        .inline-actions { display: flex; justify-content: space-between; align-items: center; }
        .muted { color: var(--soft); font-size: 14px; }
        .stack { display: flex; flex-direction: column; gap: 10px; }
        .alert {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(239,68,68,0.4);
            color: #fecdd3;
            background: rgba(239,68,68,0.12);
        }
        .alert.success {
            border-color: rgba(34,197,94,0.5);
            color: #bbf7d0;
            background: rgba(34,197,94,0.12);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        th { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); }
        .pill-action {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: #e2e8f0;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(14,165,233,0.15);
            color: #bae6fd;
            font-size: 12px;
        }
        .hx-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 rgba(14,165,233,0.35);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(14,165,233,0.3); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(14,165,233,0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(14,165,233,0); }
        }
        @media (max-width: 725px) {
            body { padding: 18px 14px 48px; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .inline-actions { flex-direction: column; gap: 12px; align-items: flex-start; }
            button, input { width: 100%; }
        }
    </style>
</head>

</div>
</body>
